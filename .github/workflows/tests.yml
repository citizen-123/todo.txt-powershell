name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pester:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester
          (Get-Module Pester).Version

      - name: Run tests
        shell: pwsh
        run: pwsh -File tests/Invoke-Tests.ps1 -CI

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results-${{ matrix.os }}
          path: |
            tests/testresults.xml
            tests/coverage.xml
          if-no-files-found: ignore

  lint:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    # Non-blocking for now: the exclude list in PSScriptAnalyzerSettings.psd1 was
    # chosen from a code read (the analyzer could not be run in the authoring
    # sandbox). Flip to blocking once a clean baseline is confirmed here.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: pwsh -File tests/Invoke-Lint.ps1

  label:
    name: tests-passing label
    needs: pester
    # Run after the whole Pester matrix on PRs (regardless of outcome) so the
    # label is added when tests pass and removed when they don't. Skipped for
    # pushes to main, where there is no PR to label, and for fork PRs whose
    # GITHUB_TOKEN is read-only.
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Update tests-passing label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.pester.result }}
        run: |
          gh label create tests-passing --repo "$REPO" --color 0e8a16 \
            --description "All CI tests passing" --force || true
          if [ "$RESULT" = "success" ]; then
            gh pr edit "$PR" --repo "$REPO" --add-label tests-passing
          else
            gh pr edit "$PR" --repo "$REPO" --remove-label tests-passing || true
          fi

  release:
    name: Release on version bump
    needs: pester
    # On a push to main (i.e. a merged PR) with a green test matrix, cut a
    # GitHub Release tagged v<ModuleVersion> -- but only when that version has no
    # release yet, so ordinary merges that don't bump the manifest are no-ops.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create release for a new manifest version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          $version = (Import-PowerShellDataFile ./src/TodoTxt.psd1).ModuleVersion
          $tag = "v$version"

          gh release view $tag --repo $env:REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; nothing to do."
            exit 0
          }

          # Use this version's CHANGELOG section as the release notes when present.
          $notes = ""
          if (Test-Path ./CHANGELOG.md) {
            $lines = Get-Content ./CHANGELOG.md
            $start = ($lines | Select-String -Pattern "^##\s*\[$([regex]::Escape($version))\]" | Select-Object -First 1).LineNumber
            if ($start) {
              $body = for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^##\s*\[') { break }
                $lines[$i]
              }
              $notes = ($body -join "`n").Trim()
            }
          }
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release $tag" }

          $notesFile = New-TemporaryFile
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          gh release create $tag --repo $env:REPO --title $tag --notes-file $notesFile --target $env:GITHUB_SHA
          Write-Host "Created release $tag."
